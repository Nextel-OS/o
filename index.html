<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nextel OS 1.0</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/shell.css">
</head>
<body>
<div id="boot">
  <div class="boot-name">Nextel<span>OS</span></div>
  <div class="boot-stage" id="boot-stage">Инициализация…</div>
  <div class="boot-progress"><div id="boot-bar"></div></div>
</div>

<div id="desktop">
  <div id="icons"></div>
  <div id="marquee"></div>
</div>

<div id="taskbar">
  <button id="startbtn"></button>
  <button id="searchbtn"></button>
  <div id="tasks"></div>
  <div id="tray">
    <div id="clock"><span id="clk-t">--:--</span></div>
  </div>
</div>

<div id="startmenu"></div>
<div id="ctxmenu"></div>

<script src="js/boot.js"></script>
</body>
</html>
