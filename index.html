<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nextel OS 1.0</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/shell.css">
<link rel="stylesheet" href="styles/apps.css">
</head>
<body>

<!-- ================= ЗАГРУЗКА ================= -->
<div id="boot">
  <div class="boot-logo">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
      <circle cx="32" cy="32" r="22" stroke-dasharray="104 34" transform="rotate(-45 32 32)"/>
      <circle cx="32" cy="32" r="7" fill="currentColor" stroke="none"/>
    </svg>
  </div>
  <div class="boot-name">Nextel<span>OS</span></div>
  <div class="boot-ver">Версия 1.0.0 &nbsp;·&nbsp; сборка 2026.11.14</div>
  <div class="boot-progress"><div id="boot-bar"></div></div>
  <div class="boot-stage" id="boot-stage">Инициализация ядра…</div>
  <div class="boot-foot">Nextel Corporation</div>
</div>

<!-- ================= ОБОЛОЧКА ================= -->
<div id="desktop">
  <div id="widgets"></div>
  <div id="icons"></div>
  <div id="marquee"></div>
</div>

<div id="taskbar">
  <button id="startbtn" title="Пуск"></button>
  <button id="searchbtn" title="Поиск (Ctrl+Space)"></button>
  <div id="tasks"></div>
  <div id="tray">
    <button class="tray-btn" data-tray="quick" title="Быстрые настройки"></button>
    <button class="tray-btn" data-tray="notif" title="Уведомления"></button>
    <div id="clock"><span id="clk-t">--:--</span><small id="clk-d">--.--.----</small></div>
  </div>
</div>

<div id="startmenu"></div>
<div id="ctxmenu"></div>
<div id="toasts"></div>
<div id="notif-panel"></div>
<div id="quick-panel"></div>
<div id="calendar-pop"></div>
<div id="spotlight"></div>
<div id="taskview"></div>
<div id="lockscreen"></div>
<div id="power-screen"></div>
<div id="hud"></div>

<script src="js/boot.js"></script>
</body>
</html>
