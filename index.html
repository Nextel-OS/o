<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#0a84ff">
    <title>Nextel OS 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <div id="boot-screen">
        <div class="boot-logo">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
                <circle cx="32" cy="32" r="22" stroke-dasharray="104 34" transform="rotate(-45 32 32)"/>
                <circle cx="32" cy="32" r="7" fill="currentColor" stroke="none"/>
            </svg>
        </div>
        <div class="boot-name">Nextel<span>OS</span></div>
        <div class="boot-ver">Версия 2.0.0 &nbsp;·&nbsp; сборка 2026</div>
        <div class="boot-progress-bar"><div id="boot-progress"></div></div>
        <div class="boot-stage" id="boot-stage">Инициализация ядра...</div>
    </div>

    <div id="lock-screen">
        <div class="lock-time" id="lock-time">00:00</div>
        <div class="lock-date" id="lock-date">1 января</div>
        <div class="lock-user">
            <div class="lock-hint">Нажмите для входа</div>
            <button class="lock-enter-btn" id="lock-enter-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="power-off-screen"><div class="power-spinner"></div><div class="power-text">Завершение работы...</div></div>
    <div id="reboot-screen"><div class="power-spinner"></div><div class="power-text">Перезагрузка...</div></div>

    <canvas id="live-wallpaper-canvas"></canvas>

    <div id="desktop">
        <div id="widgets-container"></div>
        <div id="icons-container"></div>
        <div id="selection-marquee"></div>
    </div>

    <div id="windows-layer"></div>

    <div id="taskbar">
        <button id="start-btn" title="Пуск"></button>
        <button id="search-btn" title="Поиск"></button>
        <div id="tasks-container"></div>
        <div id="system-tray">
            <div class="tray-icons">
                <div id="tray-battery" style="display:none;"></div>
                <button id="tray-notifications"></button>
                <button id="tray-quick-settings"></button>
            </div>
            <div id="tray-clock">
                <div id="clock-time">00:00</div>
                <div id="clock-date">01.01.2026</div>
            </div>
            <div id="tray-show-desktop"></div>
        </div>
    </div>

    <div id="start-menu"></div>
    <div id="context-menu"></div>
    <div id="notification-center"></div>
    <div id="quick-settings-panel"></div>
    <div id="calendar-popup"></div>
    <div id="spotlight-overlay">
        <div class="spotlight-box">
            <input type="text" id="spotlight-input" placeholder="Поиск..." autocomplete="off">
            <div id="spotlight-results"></div>
        </div>
    </div>
    <div id="task-view-overlay"></div>
    <div id="toast-container"></div>
    <div id="clipboard-panel"></div>
    <div id="alevtina-panel"></div>

    <script src="core.js"></script>
    <script src="ui.js"></script>
    <script src="system.js"></script>
    <script src="apps_prod.js"></script>
    <script src="apps_net.js"></script>
    <script src="apps_util.js"></script>
    <script src="games_1.js"></script>
    <script src="games_2.js"></script>
    <script src="apps_extra.js"></script>
    <script src="apps_more.js"></script>
</body>
</html>
